<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz</title>
     <link rel="stylesheet" href="pontuacao.css">
    <script src="pontuacao.js" defer></script>

   
</head>
<body>

    <header>
       <img src="./imagens/logo.dev.png" class="logo" alt="logo">
      </header>

    <main class="pagina-resultado">
        <fieldset class="painel-pontuacao">
            <legend>RESULTADO</legend>
            <h2>Resultado do quiz</h2>
            <p id="resultado">Calculando sua pontuação...</p>
            <button class="btn-reiniciar" onclick="reiniciarQuiz()">Jogar novamente</button>
        </fieldset>
    </main>


    <div id="meuOverlay" class="fundo-escuro-overlay">
        
     
        <div id="telaAcerto" class="card acerto">
        <h1>QUIZ FINALIZADO!</h1>
            <button class="btn-avancar" onclick="fecharTela()">Ver resultado</button>
        </div>

        
        <div id="telaErro" class="card erro">
            <h1>QUIZ FINALIZADO!</h1>
            <button class="btn-avancar" onclick="fecharTela()">Ver resultado</button>
        </div>

    </div>
</body>
</html>
